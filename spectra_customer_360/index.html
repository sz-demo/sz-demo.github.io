<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Спектра · CX-платформа СИБУР</title>
<style>
/* =========================================================================
   ДИЗАЙН-ТОКЕНЫ. Только системные шрифты, никаких внешних подключений.
   ========================================================================= */
:root{
  /* Палитра приведена к фактическому фирменному цвету СИБУРа — синему/
     цвету морской волны (см. sibur-holding/logo: «#55b4c7»). Зелёно-
     оранжевая версия была ошибочной и заменена целиком. Условные цвета
     NPS-сегментов (детрактор/нейтрал/промоутер) остаются отдельной,
     функциональной шкалой — это данные, а не брендинг, их нельзя путать
     с оценкой "хорошо/плохо" по смыслу цвета. */
  --bg:#F1F7F8; --surface:#FFFFFF; --surface-2:#E7F3F5;
  --nav-bg:#123B47; --nav-bg-2:#164F5E; --nav-text:#AEDCE6; --nav-text-active:#FFFFFF;
  --accent:#2FA8C7; --accent-dark:#146B80; --accent-soft:#E1F3F7;
  --brand-navy:#123B47; --brand-navy-2:#1D6E85; --brand-blue:#55B4C7; --brand-blue-soft:#E1F3F7;
  --ink:#0F1B1F; --ink-soft:#47585C; --ink-faint:#6C8A91;
  --border:#D5E6E9; --border-strong:#B7D8DE;
  --green:#1E9D63; --green-soft:#E4F7ED;
  --yellow:#B9820E; --yellow-soft:#FBF1D8;
  --red:#D2445A; --red-soft:#FBE7EB;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(11,59,46,.06),0 1px 8px rgba(11,59,46,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-width:1280px;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.5;}
h1,h2,h3,h4{margin:0;font-weight:600;}
p{margin:0;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
button,select,input{font-family:var(--font);}
a{color:inherit;}
svg text{font-family:var(--mono);}

.app{display:flex;min-height:100vh;}
.sidebar{width:230px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-text);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:6px 10px 20px;}
.sidebar-brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.sidebar-brand .name{color:#fff;font-weight:700;font-size:15px;letter-spacing:.01em;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--nav-text);transition:background .12s;}
.nav-item svg{flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--nav-bg-2);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{padding:10px;margin-top:10px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot .tag{font-family:var(--mono);font-size:10.5px;color:var(--nav-text);}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.topbar .company{font-weight:700;font-size:13.5px;margin-right:6px;}
.topbar input[type=text]{border:1px solid var(--border-strong);border-radius:7px;padding:6px 10px;font-size:12px;width:190px;background:var(--surface-2);}
.topbar select{border:1px solid var(--border-strong);border-radius:7px;padding:6px 9px;font-size:12px;background:var(--surface);color:var(--ink);cursor:pointer;}
.topbar .btn-reset{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.topbar .btn-reset:hover{background:var(--surface-2);}
.samplesize{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.importdate{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);white-space:nowrap;}
#main-content{padding:22px 24px 48px;max-width:1520px;}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:1fr 1fr 1fr;} .grid-4{grid-template-columns:repeat(4,1fr);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
.card-title{font-size:12.5px;font-weight:600;}
.card-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;margin-bottom:10px;}
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;}
.section-title:first-child{margin-top:0;}

.kpi .num{display:block;font-size:22px;font-weight:600;}
.kpi .kpi-label{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.kpi .kpi-n{font-family:var(--mono);font-size:10px;color:var(--ink-faint);}
.kpi .kpi-delta{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:16px;}
.d-up{background:var(--green-soft);color:var(--green);} .d-down{background:var(--red-soft);color:var(--red);} .d-flat{background:var(--surface-2);color:var(--ink-soft);}
.kpi{cursor:pointer;} .kpi:hover{border-color:var(--accent);}
.chart-box{position:relative;min-height:210px;}
.chart-err{border:1px dashed var(--border-strong);border-radius:8px;padding:16px;color:var(--ink-faint);font-size:11.5px;text-align:center;}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:14px;}
.tag-real{background:var(--accent-soft);color:var(--accent-dark);} .tag-real::before{content:'●';font-size:8px;}
.tag-empty{background:var(--surface-2);color:var(--ink-faint);border:1px dashed var(--border-strong);} .tag-empty::before{content:'○';font-size:8px;}
.tag-warn{background:var(--yellow-soft);color:var(--yellow);}
.tag-mock{background:var(--surface-2);color:var(--ink-faint);border:1px dashed var(--border-strong);margin-top:8px;display:inline-block;}
.mock-frame{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:8px;padding:6px 4px;margin:10px 0 4px;opacity:.9;}
.pill{display:inline-block;padding:3px 9px;border-radius:14px;font-size:10.5px;font-family:var(--mono);white-space:nowrap;}
.pill-promoter{background:var(--green-soft);color:var(--green);} .pill-passive{background:var(--yellow-soft);color:var(--yellow);} .pill-detractor{background:var(--red-soft);color:var(--red);}

table.dt{width:100%;border-collapse:collapse;font-size:12px;}
table.dt th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 9px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;}
table.dt th:hover{color:var(--accent);}
table.dt th.sorted::after{content:' ▾';} table.dt th.sorted-asc::after{content:' ▴';}
table.dt td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top;}
table.dt tr:hover td{background:var(--surface-2);}
table.dt tr.clickable{cursor:pointer;}
.table-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.table-toolbar input[type=text]{border:1px solid var(--border-strong);border-radius:7px;padding:6px 10px;font-size:12px;width:220px;}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:11.5px;cursor:pointer;color:var(--ink);}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);} .btn.primary:hover{background:var(--accent-dark);}
.chip-toggle{display:inline-flex;background:var(--surface-2);border-radius:7px;padding:2px;}
.chip-toggle button{border:none;background:transparent;padding:5px 11px;border-radius:5px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);}
.chip-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.preset-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:16px;padding:5px 12px;font-size:11px;cursor:pointer;}
.preset-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pagination{display:flex;align-items:center;gap:10px;padding:10px 9px;font-size:11.5px;color:var(--ink-soft);}
.pagination button{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;}
.pagination button:disabled{opacity:.4;cursor:not-allowed;}

.empty-state{border:1px dashed var(--border-strong);border-radius:10px;padding:20px 22px;background:repeating-linear-gradient(135deg, var(--surface-2) 0 8px, transparent 8px 16px);}
.empty-state h4{font-size:12.5px;margin-bottom:5px;} .empty-state p{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;}
.btn-disabled{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink-faint);border-radius:7px;padding:6px 13px;font-size:11.5px;cursor:not-allowed;}

.tabs{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:8px;margin-bottom:14px;}
.tabs button{border:none;background:transparent;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

.comment-row{border-bottom:1px solid var(--border);padding:12px 2px;}
.comment-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
.comment-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}
.comment-text{font-size:12.5px;color:var(--ink);font-style:italic;line-height:1.5;}

table.heat{border-collapse:collapse;font-size:11px;}
table.heat th{padding:6px 8px;font-size:10px;color:var(--ink-soft);text-align:left;}
table.heat td{padding:0;text-align:center;}
.heat-cell{width:64px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;}
.heat-na{background:repeating-linear-gradient(135deg, var(--surface-2) 0 5px, transparent 5px 10px);color:var(--ink-faint);}

.modal-overlay{position:fixed;inset:0;background:rgba(15,17,35,.45);display:none;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:100;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border-radius:12px;max-width:900px;width:100%;max-height:75vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modal-box .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-close{border:none;background:var(--surface-2);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:14px;}
#toast-container{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast.err{background:var(--red);}

.integrity-strip{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--brand-blue-soft);color:var(--brand-navy-2);border-radius:10px;padding:11px 16px;font-size:11.5px;margin-bottom:16px;}
.hero-brand{
  background:linear-gradient(115deg, var(--brand-navy) 0%, var(--brand-navy-2) 62%, #1D6E85 100%);
  color:#E3F6FA;border-radius:14px;padding:22px 26px;margin-bottom:16px;
  display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;
}
.hero-brand::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:40%;background:rgba(143,227,192,.16);transform:rotate(18deg);}
.hero-brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-blue);margin-bottom:8px;}
.hero-brand h1{font-size:20px;font-weight:600;line-height:1.4;color:#fff;max-width:62ch;position:relative;}
.hero-brand h1 .num{color:var(--accent);font-weight:700;}
.hero-brand .hero-caveat{font-size:11px;color:#BFE3EC;margin-top:10px;max-width:56ch;line-height:1.5;}
.hero-side{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:14px 16px;position:relative;}
.hero-side .card-title{color:#fff;}
.insight-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
.insight-list li{font-size:12px;line-height:1.55;padding-left:16px;position:relative;color:#EAF6F9;}
.insight-list li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:700;}
.risk-item{display:grid;grid-template-columns:80px 1fr 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.risk-item:last-child{border-bottom:none;}
.risk-bar-track{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.risk-bar-fill{height:100%;border-radius:4px;}
.risk-score-high{color:var(--red);} .risk-score-mid{color:var(--yellow);} .risk-score-low{color:var(--green);}
.warn-badge{background:var(--yellow-soft);color:var(--yellow);border-radius:6px;padding:5px 9px;font-size:11px;display:inline-block;}
.small-muted{font-size:11px;color:var(--ink-faint);}
.driver-block{border-bottom:1px solid var(--border);padding:16px 0;}
.driver-block:first-child{padding-top:0;} .driver-block:last-child{border-bottom:none;}
.mini-hist{display:flex;align-items:flex-end;gap:4px;height:44px;}
.mini-hist .bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;}
.legend-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);}
.legend-dot::before{content:'●';font-size:9px;}
</style>

itable for us as price performance \nBut it is suitable for the market and the majority."}, {"year": 2025, "id": 111134, "country": "Турция", "tier": "ND", "industry": "ND", "sat": 5, "satComment": null, "manager": 5, "managerComment": null, "orderSupport": 5, "orderSupportComment": null, "documents": 5, "documentsComment": null, "volume": 5, "volumeComment": null, "quality": 5, "qualityComment": null, "price": 5, "priceComment": null, "paymentTerms": 5, "paymentTermsComment": null, "cpSpeed": 5, "cpSpeedComment": null, "logistics": 5, "logisticsComment": null, "packaging": 5, "packagingComment": null, "techService": 5, "techServiceComment": null, "webConvenience": null, "webConvenienceComment": null, "partnershipDevelop": null, "partnershipPromote": null, "partnershipUnderstandMarket": null, "partnershipUnderstandUs": null, "partnershipHelpsGrow": null, "partnershipComment": null, "nps": 9, "npsComment": "With Sibur, we're once again experiencing the incredible impact individuals' working principles have on our perceptions of the company. We're extremely pleased to work with Ahmet Saatci, as are Marina and Anna from customer service. However, we're definitely not able to establish quality communication regarding products that have been transferred from Ahmet to Bekir."}, {"year": 2025, "id": 111135, "country": "Турция", "tier": "ND", "industry": "ND", "sat": 3, "satComment": "YOUR PROCESSES ARE TOO SLOW, THE DOCUMENTS (PROFORMA FTR, FTR, CUSTOMS ETC.) ARRIVE TOO LATE. YOU ARE DELAYING SHIPPING YOUR READY GOODS DESPITE PAYMENT BEING MADE.", "manager": 3, "managerComment": "We are having trouble in communication, the processes are slow.", "orderSupport": 2, "orderSupportComment": "We are having trouble in communication, the processes are slow.", "documents": 2, "documentsComment": "YOUR PROCESSES ARE TOO SLOW. EVEN THOUGH WE HAVE COMMUNICATED OUR COMPLAINTS ABOUT THIS SUBJECT BEFORE, there has been no improvement. Due to delays we have to buy from your competitors.", }

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function isNum(v){ return typeof v==='number' && !isNaN(v); }
function mean(rows, key){
  const vals = rows.map(r=>r[key]).filter(isNum);
  if(vals.length===0) return {value:null, n:0};
  return {value: vals.reduce((a,b)=>a+b,0)/vals.length, n:vals.length};
}
function median(rows, key){
  const vals = rows.map(r=>r[key]).filter(isNum).sort((a,b)=>a-b);
  if(vals.length===0) return {value:null,n:0};
  const mid=Math.floor(vals.length/2);
  return {value: vals.length%2 ? vals[mid] : (vals[mid-1]+vals[mid])/2, n:vals.length};
}
function distribution(rows, key, min, max){
  const counts = {};
  for(let i=min;i<=max;i++) counts[i]=0;
  rows.forEach(r=>{ if(isNum(r[key]) && r[key]>=min && r[key]<=max) counts[Math.round(r[key])]++; });
  return counts;
}

function npsCalc(rows){
  const vals = rows.map(r=>r.nps).filter(isNum);
  const n = vals.length;
  if(n===0) return {nps:null,n:0,promoters:0,passives:0,detractors:0,promoterPct:0,passivePct:0,detractorPct:0};
  const promoters = vals.filter(v=>v>=9).length, passives = vals.filter(v=>v>=7&&v<=8).length, detractors = vals.filter(v=>v<=6).length;
  return { nps: Math.round((promoters-detractors)/n*1000)/10, n, promoters, passives, detractors,
    promoterPct: Math.round(promoters/n*1000)/10, passivePct: Math.round(passives/n*1000)/10, detractorPct: Math.round(detractors/n*1000)/10 };
}
function pearson(rows, keyX, keyY){
  const pairs = rows.filter(r=>isNum(r[keyX]) && isNum(r[keyY]));
  const n = pairs.length;
  if(n<3) return {r:null, n};
  const xs=pairs.map(r=>r[keyX]), ys=pairs.map(r=>r[keyY]);
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); dx+=(xs[i]-mx)**2; dy+=(ys[i]-my)**2; }
  if(dx===0||dy===0) return {r:null,n};
  return {r: Math.round(num/Math.sqrt(dx*dy)*100)/100, n};
}

  const ids26=new Set(r26.map(r=>r.id)); const out=[];
  r25.forEach(row25=>{ if(ids26.has(row25.id)){ const row26=r26.find(r=>r.id===row25.id);
    out.push({id:row25.id,row25,row26,deltaNps:fmtDelta(row26.nps,row25.nps,0),deltaSat:fmtDelta(row26.sat,row25.sat,0)}); }});
  return out;
}
function uniqueClientRows(rows){
  const map={}; rows.slice().sort((a,b)=>a.year-b.year).forEach(r=>{map[r.id]=r;}); return Object.values(map);
}
function buildCommentsFeed(rows){

      metric:'Готовность рекомендовать (NPS)', score:r.nps, text:r.npsComment, nps:r.nps, seg:npsSegmentOf(r.nps),
      theme:classifyTheme(r.npsComment), tone: isNum(r.nps)?(r.nps>=9?{label:'позитивная',cls:'d-up'}:(r.nps>=7?{label:'нейтральная',cls:'d-flat'}:{label:'негативная',cls:'d-down'})):{label:'не определено',cls:'d-flat'}}); }
    if(r.partnershipComment){ out.push({key:r.id+'-'+r.year+'-partner', id:r.id, year_:r.year, country:r.country, tier:r.tier, industry:r.industry,
      metric:'Партнёрство (общий комментарий)', score:null, text:r.partnershipComment, nps:r.nps, seg:npsSegmentOf(r.nps),
      theme:classifyTheme(r.partnershipComment), tone:{label:'не определено',cls:'d-flat'}}); }

function buildAutoSummary(clientRows, last){
  const parts=[];
  const scored = DRIVERS.map(d=>({label:d.label,v:last[d.key]})).filter(d=>isNum(d.v));
  if(scored.length){
    const worst=scored.slice().sort((a,b)=>a.v-b.v)[0], best=scored.slice().sort((a,b)=>b.v-a.v)[0];
    parts.push(`Самая низкая оценка клиента — «${worst.label}» (${worst.v} из 5), самая высокая — «${best.label}» (${best.v} из 5).`);
  }
  if(isNum(last.nps)) parts.push(`Итоговая оценка готовности рекомендовать за волну ${last.year} — ${last.nps} из 10 (сегмент: ${segRu(npsSegmentOf(last.nps))}).`);
  if(clientRows.length>=2){ const d=fmtDelta(clientRows[1].nps, clientRows[0].nps, 0); if(d!==null) parts.push(`Изменение NPS год к году: ${d>0?'+':''}${d} балл(ов).`); }
  if(last.npsComment) parts.push(`Комментарий клиента: «${last.npsComment}».`);
  return parts.join(' ') || 'Недостаточно фактических данных для резюме.';
}
function segRu(s){ return {promoter:'промоутер',passive:'нейтрал',detractor:'детрактор'}[s]||'—'; }

/* -------------------------------------------------------------------------
   ПРЕДИКТИВНАЯ АНАЛИТИКА
   Важный принцип: никаких «магических» ИИ-чисел без объяснения. Каждый
   прогноз и каждая оценка риска строится по прозрачной, проверяемой формуле
   поверх реальных цифр и подписывается как оценка/индикатор, а не факт.
   При двух точках замера (2025, 2026) прогноз — это простая линейная
   экстраполяция; это статистически слабый прогноз, и интерфейс обязан
   честно на это указывать.
   ------------------------------------------------------------------------- */
const PARTNERSHIP_KEYS = ['partnershipDevelop','partnershipPromote','partnershipUnderstandMarket','partnershipUnderstandUs','partnershipHelpsGrow'];
function computePartnershipIndex(rows){
  const vals = [];
  rows.forEach(r=>{ PARTNERSHIP_KEYS.forEach(k=>{ if(isNum(r[k])) vals.push(r[k]); }); });
  if(vals.length===0) return {value:null,n:0};
  return {value: vals.reduce((a,b)=>a+b,0)/vals.length, n:vals.length};
}
// Простая линейная экстраполяция NPS компании на следующую волну по двум
// имеющимся точкам. Возвращает null, если для расчёта недостаточно данных.
function computeNpsForecast(){
  const r25 = applyGlobalFilters(getYearRows(2025)), r26 = applyGlobalFilters(getYearRows(2026));
  const n25 = npsCalc(r25), n26 = npsCalc(r26);
  if(n25.nps===null || n26.nps===null) return null;
  const delta = Math.round((n26.nps-n25.nps)*10)/10;
  const forecast = Math.round((n26.nps+delta)*10)/10;
  return {n25:n25.nps, n26:n26.nps, delta, forecast, sampleN25:n25.n, sampleN26:n26.n};
}
// Прозрачная rule-based оценка риска оттока клиента: каждое правило
// объясняется отдельной строкой в reasons[], итоговый score — их сумма
// (0-100). Это не модель машинного обучения, а явная, проверяемая эвристика
// поверх реальных ответов клиента — так честнее, чем выдавать чёрный ящик.
function computeChurnRisk(clientRows, last){
  let score = 0; const reasons = [];
  const seg = npsSegmentOf(last.nps);
  if(seg==='detractor'){ score+=40; reasons.push({text:'Клиент в сегменте «детрактор» (NPS ≤ 6)', pts:40}); }
  else if(seg==='passive'){ score+=15; reasons.push({text:'Клиент в сегменте «нейтрал» (NPS 7–8) — не защищён от оттока', pts:15}); }
  else if(!seg){ score+=10; reasons.push({text:'Нет ответа по NPS за последнюю волну — риск неизвестен', pts:10}); }
  if(clientRows.length>=2){
    const delta = fmtDelta(clientRows[clientRows.length-1].nps, clientRows[clientRows.length-2].nps, 0);
    if(delta!==null){
      if(delta<=-3){ score+=30; reasons.push({text:`Резкое падение NPS год к году: ${delta}`, pts:30}); }
      else if(delta<0){ score+=18; reasons.push({text:`Снижение NPS год к году: ${delta}`, pts:18}); }
      else if(delta>0){ score=Math.max(0,score-10); reasons.push({text:`NPS вырос год к году: +${delta} (снижает риск)`, pts:-10}); }
    }
  }
  [['price','Цена'],['manager','Взаимодействие с менеджером'],['techService','Технический сервис']].forEach(([k,label])=>{
    if(isNum(last[k]) && last[k]<=2){ score+=10; reasons.push({text:`Низкая оценка «${label}»: ${last[k]} из 5`, pts:10}); }
  });
  const riskyThemes = new Set(['Цена','Коммуникация','Менеджер']);
  const feedThemes = new Set();
  DRIVERS.forEach(d=>{ if(d.commentKey && last[d.commentKey]) feedThemes.add(classifyTheme(last[d.commentKey])); });
  if(last.npsComment) feedThemes.add(classifyTheme(last.npsComment));
  feedThemes.forEach(t=>{ if(riskyThemes.has(t)){ score+=5; reasons.push({text:`В комментариях затронута тема «${t}»`, pts:5}); } });
  score = Math.max(0, Math.min(100, score));
  const level = score>=60?'высокий':(score>=30?'средний':'низкий');
  return {score, level, reasons};
}
// Список клиентов с наивысшим риском по последней доступной волне —
// используется в вотчлисте на обзорном экране.
function computeRiskWatchlist(rows, limit){
  const byId = uniqueClientRows(rows);
  const scored = byId.map(r=>{
    const clientRows = RAW_DATA.filter(x=>x.id===r.id).sort((a,b)=>a.year-b.year);
    const risk = computeChurnRisk(clientRows, r);
    return {row:r, risk};
  });
  scored.sort((a,b)=>b.risk.score-a.risk.score);
  return scored.slice(0, limit||8);
}
// Собирает 3-5 фактических инсайтов по текущей выборке (для панели
// "Что показывают данные"). Каждая строка — производная реальных расчётов,
// а не текст, придуманный заранее.
function buildExecutiveInsights(rows){
  const insights = [];
  const r25=applyGlobalFilters(getYearRows(2025)), r26=applyGlobalFilters(getYearRows(2026));
  const n25=npsCalc(r25), n26=npsCalc(r26), s25=mean(r25,'sat'), s26=mean(r26,'sat');
  if(n25.n>0 && n26.n>0){
    const npsDelta = fmtDelta(n26.nps,n25.nps,1), satDelta = fmtDelta(s26.value,s25.value,2);
    if(npsDelta!==null && satDelta!==null && npsDelta<0 && satDelta>0){
      insights.push(`NPS снизился (${npsDelta} п.п.), при этом общая удовлетворённость выросла (+${satDelta}) — расхождение указывает на конкретный болевой фактор, а не общее охлаждение отношений.`);
    }
  }
  const priceM25=mean(r25,'price'), priceM26=mean(r26,'price');
  if(priceM25.value!==null && priceM26.value!==null){
    const d = Math.round((priceM26.value-priceM25.value)*100)/100;
    if(d<=-0.5) insights.push(`Оценка «Цена» упала с ${priceM25.value.toFixed(2)} до ${priceM26.value.toFixed(2)} — самое резкое движение среди всех драйверов.`);
  }
  const tracked = getTrackedClients();
  const quiet = tracked.filter(t=>t.deltaNps<0 && npsSegmentOf(t.row26.nps)!=='detractor');
  if(quiet.length>0) insights.push(`${quiet.length} клиент(а/ов) снижают NPS год к году, оставаясь формально в «безопасном» сегменте — риск не виден по одной итоговой цифре.`);
  const corr26 = DRIVERS.map(d=>({label:d.label, c:pearson(r26,d.key,'nps')})).filter(d=>d.c.r!==null && d.c.n>=MIN_N_RELIABLE).sort((a,b)=>b.c.r-a.c.r);
  if(corr26.length) insights.push(`Сильнее всего с NPS 2026 связан драйвер «${corr26[0].label}» (r=${corr26[0].c.r}, n=${corr26[0].c.n}).`);
  const watch = computeRiskWatchlist(rows, 100).filter(w=>w.risk.level==='высокий');
  if(watch.length>0) insights.push(`${watch.length} клиент(а/ов) в текущей выборке отмечены как клиенты с высоким риском оттока по совокупности признаков.`);
  return insights.slice(0,5);
}

/* =========================================================================
   СЕКЦИЯ 4. УПРАВЛЕНИЕ СОСТОЯНИЕМ
   Единый объект состояния приложения. Любое его изменение проходит через
   централизованные функции render()/renderScreen(), которые управляют
   перерисовкой. localStorage используется ТОЛЬКО для UI-настроек
   (выбранный раздел, фильтры) — не для хранения исходных данных.
   ========================================================================= */
const appState = {
  screen:'overview',
  period:'2026',
  country:'all', industry:'all', tier:'all', npsSegment:'all',
  search:'',
  selectedClientId:null,
  clientsMode:'unique', clientsPreset:'none', clientsSort:{key:'nps',dir:'desc'}, clientsPage:0,
  commentsSort:{key:'year_',dir:'desc'}, commentsSearch:'', commentsTheme:'all', commentsPage:0,
  comparisonMode:'all', driverPickHist:'sat', profileTab:'overview',
};
function persistState(){
  try{
    const toSave = {screen:appState.screen, period:appState.period, country:appState.country, industry:appState.industry,
      tier:appState.tier, npsSegment:appState.npsSegment};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){ /* localStorage недоступен (приватный режим, файловые ограничения и т.п.) — просто продолжаем без сохранения */ }
}
function loadPersistedState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    Object.assign(appState, saved);
  }catch(e){ /* игнорируем — приложение работает с настройками по умолчанию */ }
}
function debounce(fn, ms){
  let t=null;
  return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}

/* =========================================================================
   СЕКЦИЯ 5. ФИЛЬТРЫ
   ========================================================================= */
function getBaseRows(){
  if(appState.period==='2025') return getYearRows(2025);
  if(appState.period==='2026') return getYearRows(2026);
  return RAW_DATA.slice();
}
function matchesSearch(r, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(String(r.id).includes(q)) return true;
  if((r.country||'').toLowerCase().includes(q)) return true;
  if((r.industry||'').toLowerCase().includes(q)) return true;
  for(const d of DRIVERS){ if(d.commentKey && r[d.commentKey] && String(r[d.commentKey]).toLowerCase().includes(q)) return true; }
  if(r.npsComment && String(r.npsComment).toLowerCase().includes(q)) return true;
  return false;
}
function applyGlobalFilters(rows){
  return rows.filter(r=>
    (appState.country==='all'||r.country===appState.country) &&
    (appState.industry==='all'||r.industry===appState.industry) &&
    (appState.tier==='all'||r.tier===appState.tier) &&
    (appState.npsSegment==='all'||npsSegmentOf(r.nps)===appState.npsSegment) &&
    matchesSearch(r, appState.search));
}
function getFilteredRows(){ return applyGlobalFilters(getBaseRows()); }
function applyClientsPreset(rows){
  const tracked = getTrackedClients();
  switch(appState.clientsPreset){
    case 'detractors': return rows.filter(r=>npsSegmentOf(r.nps)==='detractor');
    case 'promoters': return rows.filter(r=>npsSegmentOf(r.nps)==='promoter');
    case 'managerLow': return rows.filter(r=>isNum(r.manager)&&r.manager<=2);
    case 'priceLow': return rows.filter(r=>isNum(r.price)&&r.price<=2);
    case 'qualityLow': return rows.filter(r=>isNum(r.quality)&&r.quality<=2);
    case 'negComments': return rows.filter(r=>isNum(r.nps)&&r.nps<=6 && r.npsComment);
    case 'tracked': { const ids=new Set(tracked.map(t=>t.id)); return rows.filter(r=>ids.has(r.id)); }
    case 'npsUp': { const ids=new Set(tracked.filter(t=>t.deltaNps>0).map(t=>t.id)); return rows.filter(r=>ids.has(r.id)); }
    case 'npsDown': { const ids=new Set(tracked.filter(t=>t.deltaNps<0).map(t=>t.id)); return rows.filter(r=>ids.has(r.id)); }
    default: return rows;
  }
}
function sortRows(rows, key, dir, numeric){
  return rows.slice().sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(numeric){ va=isNum(va)?va:-Infinity; vb=isNum(vb)?vb:-Infinity; } else { va=(va??'').toString(); vb=(vb??'').toString(); }
    if(va<vb) return dir==='asc'?-1:1; if(va>vb) return dir==='asc'?1:-1; return 0;
  });
}
function paginate(rows, page, pageSize){
  const totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
  const p = Math.min(Math.max(0,page), totalPages-1);
  return {page:p, totalPages, slice: rows.slice(p*pageSize, p*pageSize+pageSize)};
}

/* =========================================================================
   СЕКЦИЯ 7. РЕНДЕРИНГ ГРАФИКОВ
   Без сторонних библиотек — чистый inline SVG, генерируемый вручную.
   Все графики пересчитываются при каждом изменении фильтров, поскольку
   строятся из текущего отфильтрованного набора данных, а не сохраняются
   как статичные изображения. Каждый вызов обёрнут в safeDraw(), чтобы
   ошибка в одном графике не ломала остальной интерфейс (см. СЕКЦИЮ 12).
   ========================================================================= */
function safeDraw(containerId, fn){
  const el = document.getElementById(containerId);
  if(!el) return; // элемента может не быть на экране — просто выходим
  try{ fn(el); }
  catch(e){
    el.innerHTML = `<div class="chart-err">Не удалось построить график: ${escapeHtml(e.message)}</div>`;
    console.error('[spectra] chart error in #'+containerId, e);
  }
}
function shortLabel(s, len){ len=len||16; s=String(s); return s.length>len ? s.slice(0,len-1)+'…' : s; }
function svgWrap(w,h,inner){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMinYMid meet">${inner}</svg>`; }

// Простой вертикальный столбчатый график (значения могут быть отрицательными — есть нулевая линия).
function barChart(el, {labels, values, colors, yMin, yMax, height, valueFmt}){
  height = height||220;
  const W=680,H=height, padL=42,padR=10,padT=10,padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=Math.max(1,labels.length);
  const gap=plotW/n, bw=Math.min(46, gap*0.6);
  const dm=yMin, dM=yMax;
  const yScale = v => padT + plotH - ((v-dm)/(dM-dm))*plotH;
  const zeroY = yScale(Math.max(dm,Math.min(dM,0)));
  let bars='', axis='';
  labels.forEach((lab,i)=>{
    const v = values[i];
    const x = padL + gap*i + (gap-bw)/2;
    if(v===null||v===undefined||isNaN(v)){
      axis += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#6C8A91">${escapeHtml(shortLabel(lab,12))}</text>`;
      return;
    }
    const y1 = yScale(v);
    const top = Math.min(y1, zeroY), h = Math.max(1,Math.abs(y1-zeroY));
    const color = colors ? colors[i] : '#1D6E85';
    bars += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}"><title>${escapeHtml(lab)}: ${valueFmt?escapeHtml(valueFmt(v)):v}</title></rect>`;
    axis += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#6C8A91">${escapeHtml(shortLabel(lab,12))}</text>`;
  });
  const gridline = `<line x1="${padL}" x2="${W-padR}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="#B7D8DE" stroke-width="1"/>`;
  const yLabels = `<text x="4" y="${padT+4}" font-size="9" fill="#6C8A91">${dM}</text><text x="4" y="${H-padB}" font-size="9" fill="#6C8A91">${dm}</text>`;
  el.innerHTML = svgWrap(W,H, gridline+bars+axis+yLabels);
}
// Горизонтальный столбчатый график — удобен для длинных подписей (драйверы, темы).
function hBarChart(el, {labels, values, colors, max, height, valueFmt}){
  const rowH = 26, padL=170, padR=50, padT=6;
  const H = height || (labels.length*rowH+padT*2);
  const W = 680, plotW = W-padL-padR;
  const dM = max===undefined ? Math.max(1,...values.filter(isNum)) : max;
  let rows='';
  labels.forEach((lab,i)=>{
    const v = values[i];
    const y = padT + i*rowH;
    const w = isNum(v) ? Math.max(1, v/dM*plotW) : 0;
    const color = colors ? colors[i] : '#1D6E85';
    rows += `<text x="${padL-8}" y="${y+rowH*0.62}" font-size="10" text-anchor="end" fill="#47585C">${escapeHtml(shortLabel(lab,24))}</text>`;
    if(isNum(v)){
      rows += `<rect x="${padL}" y="${(y+4).toFixed(1)}" width="${w.toFixed(1)}" height="${rowH-8}" rx="3" fill="${color}"><title>${escapeHtml(lab)}: ${valueFmt?escapeHtml(valueFmt(v)):v}</title></rect>`;
      rows += `<text x="${(padL+w+6).toFixed(1)}" y="${y+rowH*0.62}" font-size="9.5" fill="#47585C" font-family="ui-monospace,monospace">${valueFmt?escapeHtml(valueFmt(v)):v}</text>`;
    } else {
      rows += `<text x="${padL+4}" y="${y+rowH*0.62}" font-size="9.5" fill="#6C8A91">н/д</text>`;
    }
  });
  el.innerHTML = svgWrap(W,H, rows);
}
// Линейный график с прогнозной точкой: сплошная линия по фактическим точкам,
// пунктир и полый маркер — до прогнозного значения. Прогноз визуально не
// маскируется под факт.
function forecastLineChart(el, {labels, values, forecastValue, yMin, yMax, height}){
  height = height||220;
  const W=680,H=height, padL=40,padR=16,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n = labels.length+1; // + прогнозная точка
  const xStep = plotW/(n-1);
  const yScale = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  let pts=[], circles='', axis='';
  labels.forEach((lab,i)=>{
    const x = padL+xStep*i, v = values[i];
    axis += `<text x="${x.toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6C8A91">${escapeHtml(lab)}</text>`;
    if(isNum(v)){ const y=yScale(v); pts.push([x,y]); circles += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#123B47"><title>${escapeHtml(lab)}: ${v}</title></circle>`; }
  });
  const fx = padL+xStep*labels.length, fy = yScale(forecastValue);
  axis += `<text x="${fx.toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#2FA8C7">прогноз</text>`;
  const solidPath = pts.length>1 ? `<path d="M ${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')}" fill="none" stroke="#123B47" stroke-width="2"/>` : '';
  const lastReal = pts[pts.length-1];
  const dashPath = lastReal ? `<path d="M ${lastReal[0].toFixed(1)} ${lastReal[1].toFixed(1)} L ${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="#2FA8C7" stroke-width="2" stroke-dasharray="5,4"/>` : '';
  const forecastMarker = `<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="6" fill="#fff" stroke="#2FA8C7" stroke-width="2.5"><title>прогноз (линейная экстраполяция): ${forecastValue}</title></circle>`;
  const gridTop = `<line x1="${padL}" x2="${W-padR}" y1="${padT}" y2="${padT}" stroke="#E3F1F3"/>`;
  const gridZero = yMin<0 && yMax>0 ? `<line x1="${padL}" x2="${W-padR}" y1="${yScale(0).toFixed(1)}" y2="${yScale(0).toFixed(1)}" stroke="#D5E6E9"/>` : '';
  const yLabels = `<text x="2" y="${padT+4}" font-size="9" fill="#6C8A91">${yMax}</text><text x="2" y="${padT+plotH}" font-size="9" fill="#6C8A91">${yMin}</text>`;
  el.innerHTML = svgWrap(W,H, gridTop+gridZero+solidPath+dashPath+circles+forecastMarker+axis+yLabels);
}
// Линейный график (тренд по годам / динамика клиента).
function lineChart(el, {labels, values, yMin, yMax, pointColors, height}){
  height = height||220;
  const W=680,H=height, padL=40,padR=16,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=labels.length;
  const xStep = n>1 ? plotW/(n-1) : 0;
  const yScale = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  let pts=[], circles='', axis='';
  labels.forEach((lab,i)=>{
    const x = padL + xStep*i;
    const v = values[i];
    axis += `<text x="${x.toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6C8A91">${escapeHtml(lab)}</text>`;
    if(isNum(v)){
      const y = yScale(v);
      pts.push([x,y]);
      const c = pointColors ? pointColors[i] : '#1D6E85';
      circles += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${c}"><title>${escapeHtml(lab)}: ${v}</title></circle>`;
    }
  });
  const path = pts.length>1 ? `<path d="M ${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')}" fill="none" stroke="#1D6E85" stroke-width="2"/>` : '';
  const gridTop = `<line x1="${padL}" x2="${W-padR}" y1="${padT}" y2="${padT}" stroke="#E7F3F5"/>`;
  const gridBot = `<line x1="${padL}" x2="${W-padR}" y1="${padT+plotH}" y2="${padT+plotH}" stroke="#E7F3F5"/>`;
  const yLabels = `<text x="2" y="${padT+4}" font-size="9" fill="#6C8A91">${yMax}</text><text x="2" y="${padT+plotH}" font-size="9" fill="#6C8A91">${yMin}</text>`;
  el.innerHTML = svgWrap(W,H, gridTop+gridBot+path+circles+axis+yLabels);
}
// Составной (stacked) столбчатый график — структура промоутеры/нейтралы/детракторы.
function stackedBarChart(el, {labels, series, height}){
  height = height||220;
  const W=680,H=height, padL=36,padR=10,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const totals = labels.map((_,i)=>series.reduce((s,se)=>s+(se.values[i]||0),0));
  const maxTotal = Math.max(1,...totals);
  const n=labels.length, gap=plotW/n, bw=Math.min(70,gap*0.55);
  let bars='', axis='';
  labels.forEach((lab,i)=>{
    const x = padL+gap*i+(gap-bw)/2;
    let yCursor = padT+plotH;
    series.forEach(se=>{
      const v = se.values[i]||0;
      const h = v/maxTotal*plotH;
      yCursor -= h;
      bars += `<rect x="${x.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${se.color}"><title>${escapeHtml(se.label)} ${escapeHtml(lab)}: ${v}</title></rect>`;
    });
    axis += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6C8A91">${escapeHtml(lab)}</text>`;
  });
  const legend = series.map((se,i)=>`<rect x="${padL+i*110}" y="0" width="9" height="9" fill="${se.color}"/><text x="${padL+i*110+13}" y="8" font-size="9.5" fill="#47585C">${escapeHtml(se.label)}</text>`).join('');
  el.innerHTML = svgWrap(W,H+16, `<g transform="translate(0,16)">${bars}${axis}</g>${legend}`);
}
// Пузырьковая матрица приоритетов (X — оценка, Y — связь с NPS, размер — n).
function bubbleChart(el, {points, xMin,xMax,yMin,yMax,xLabel,yLabel,height}){
  height = height||300;
  const W=900,H=height, padL=54,padR=20,padT=16,padB=40;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xScale = v => padL + (v-xMin)/(xMax-xMin)*plotW;
  const yScale = v => padT + plotH - (v-yMin)/(yMax-yMin)*plotH;
  const zeroY = yScale(0);
  let dots='';
  points.forEach(p=>{
    const x=xScale(p.x), y=yScale(p.y), r=Math.min(22,4+Math.sqrt(p.n)*3);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${p.color}" fill-opacity="0.72" stroke="${p.color}"><title>${escapeHtml(p.label)}: оценка ${p.x.toFixed(2)} (n=${p.n}), связь с NPS r=${p.y} (n=${p.ncorr})</title></circle>`;
    dots += `<text x="${x.toFixed(1)}" y="${(y-r-4).toFixed(1)}" font-size="8.5" text-anchor="middle" fill="#47585C">${escapeHtml(shortLabel(p.label,14))}</text>`;
  });
  const axisX = `<line x1="${padL}" x2="${W-padR}" y1="${padT+plotH}" y2="${padT+plotH}" stroke="#B7D8DE"/><text x="${W/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="#47585C">${escapeHtml(xLabel)}</text>`;
  const axisY = `<line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT+plotH}" stroke="#B7D8DE"/><line x1="${padL}" x2="${W-padR}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="#E7F3F5"/>`;
  el.innerHTML = svgWrap(W,H, axisX+axisY+dots);
}
function buildHeatmap(el, rows){
  const industries = Array.from(new Set(RAW_DATA.map(r=>r.industry))).filter(i=>i && i!=='ND').sort();
  const drivers = DRIVERS.slice(0,13);
  let html = `<table class="heat"><thead><tr><th></th>${industries.map(i=>`<th>${escapeHtml(shortLabel(i,14))}</th>`).join('')}</tr></thead><tbody>`;
  drivers.forEach(d=>{
    html += `<tr><th>${escapeHtml(d.label)}</th>`;
    industries.forEach(ind=>{
      const m = mean(rows.filter(r=>r.industry===ind), d.key);
      if(m.value===null){ html += `<td><div class="heat-cell heat-na">н/д</div></td>`; }
      else { const t=(m.value-1)/4; html += `<td title="n=${m.n}"><div class="heat-cell" style="background:${heatColor(t)};color:${t>0.55?'#fff':'#0F1B1F'}">${m.value.toFixed(1)}</div></td>`; }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
}
function heatColor(t){
  const stops=[[210,68,90],[185,130,14],[30,157,99]];
  const seg = t<0.5 ? [stops[0],stops[1],t*2] : [stops[1],stops[2],(t-0.5)*2];
  const c = seg[0].map((v,i)=>Math.round(v+(seg[1][i]-v)*seg[2]));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function miniHistHtml(dist){
  const max=Math.max(1,...Object.values(dist));
  return `<div class="mini-hist">${Object.entries(dist).map(([k,v])=>`<div class="bar" style="height:${v/max*100}%" title="${k}: ${v}"></div>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink-faint);margin-top:3px;">${Object.keys(dist).map(k=>`<span>${k}</span>`).join('')}</div>`;
}

function exportCSV(filename, rows, cols){
  const header = cols.map(c=>`"${c.label.replace(/"/g,'""')}"`).join(';');
  const lines = rows.map(r=>cols.map(c=>`"${String(c.value(r)??'').replace(/"/g,'""')}"`).join(';'));
  const csv = '\uFEFF'+[header,...lines].join('\r\n'); // BOM для корректной кириллицы в Excel
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Экспортировано: '+filename);
}
function showToast(msg, isErr){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = msg; // textContent — без риска разметки
  c.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

function renderClients(){
  let rows = getFilteredRows();
  if(appState.clientsMode==='unique') rows = uniqueClientRows(rows);
  rows = applyClientsPreset(rows);
  rows = sortRows(rows, appState.clientsSort.key, appState.clientsSort.dir, appState.clientsSort.key!=='country'&&appState.clientsSort.key!=='industry');
  const pg = paginate(rows, appState.clientsPage, 15);
  appState.clientsPage = pg.page;

  const presets = [['none','Все'],['detractors','Детракторы'],['promoters','Промоутеры'],['managerLow','Менеджер ≤ 2'],['priceLow','Цена ≤ 2'],
    ['qualityLow','Качество ≤ 2'],['negComments','С негативными комментариями'],['tracked','В обеих волнах'],['npsUp','Рост NPS'],['npsDown','Снижение NPS']];
  document.getElementById('main-content').innerHTML = `
    <h2 class="section-title">Клиенты</h2>
    <div class="table-toolbar">
      <div class="chip-toggle"><button data-action="clients-mode" data-mode="all" class="${appState.clientsMode==='all'?'active':''}">Все ответы</button>
      <button data-action="clients-mode" data-mode="unique" class="${appState.clientsMode==='unique'?'active':''}">Уникальные клиенты</button></div>
      <button class="btn" data-action="export-clients">Экспорт CSV</button>
      <span class="small-muted">n=${rows.length}</span>
    </div>
    <div class="preset-row">${presets.map(([k,l])=>`<button class="preset-btn ${appState.clientsPreset===k?'active':''}" data-action="clients-preset" data-preset="${k}">${escapeHtml(l)}</button>`).join('')}</div>
    <div class="card" style="padding:0;">${clientsTableHtml(pg.slice)}${paginationHtml(pg.page,pg.totalPages,'clients-page')}</div>
  `;
}
function clientsTableHtml(rows){
  const trackedIds = new Set(getTrackedClients().map(t=>t.id));
  const sortInd = k=> appState.clientsSort.key===k ? (appState.clientsSort.dir==='desc'?'sorted':'sorted-asc') : '';
  const head = `<tr>
    <th data-action="clients-sort" data-sort="id" class="${sortInd('id')}">ID</th>
    <th data-action="clients-sort" data-sort="country" class="${sortInd('country')}">Страна</th>
    <th data-action="clients-sort" data-sort="tier" class="${sortInd('tier')}">Тир</th>
    <th data-action="clients-sort" data-sort="industry" class="${sortInd('industry')}">Отрасль</th>
    <th data-action="clients-sort" data-sort="year" class="${sortInd('year')}">Год</th>
    <th data-action="clients-sort" data-sort="sat" class="${sortInd('sat')}">Удовл.</th>
    <th data-action="clients-sort" data-sort="nps" class="${sortInd('nps')}">NPS</th>
    <th>Сегмент</th><th>Комментариев</th><th>Темы</th><th>Обе волны</th></tr>`;
  const body = rows.map(r=>{
    const commentCount = DRIVERS.filter(d=>d.commentKey&&r[d.commentKey]).length + (r.npsComment?1:0);
    const themes = new Set(); DRIVERS.forEach(d=>{ if(d.commentKey&&r[d.commentKey]) themes.add(classifyTheme(r[d.commentKey])); }); if(r.npsComment) themes.add(classifyTheme(r.npsComment));
    const seg = npsSegmentOf(r.nps);
    return `<tr class="clickable" data-action="goto-client" data-client="${r.id}">
      <td class="num">${r.id}</td><td>${escapeHtml(r.country)||'—'}</td><td>${escapeHtml(r.tier)||'—'}</td><td>${escapeHtml(r.industry)||'—'}</td>
      <td>${r.year}</td><td class="num">${isNum(r.sat)?r.sat:'н/д'}</td><td class="num">${isNum(r.nps)?r.nps:'н/д'}</td>
      <td>${seg?`<span class="pill pill-${seg}">${segRu(seg)}</span>`:'—'}</td>
      <td class="num">${commentCount}</td><td class="small-muted">${escapeHtml(Array.from(themes).slice(0,2).join(', '))||'—'}</td>
      <td>${trackedIds.has(r.id)?'<span class="tag tag-real">да</span>':'<span class="tag tag-empty">нет</span>'}</td></tr>`;
  }).join('');
  return `<table class="dt"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function mockSvg(inner){ return `<svg viewBox="0 0 260 72" width="100%" height="72" preserveAspectRatio="xMinYMid meet">${inner}</svg>`; }

/* =========================================================================
   СЕКЦИЯ 12. ОБРАБОТЧИКИ СОБЫТИЙ (делегирование)
   Все обработчики регистрируются один раз на статичных контейнерах
   (document.body) и определяют нужное действие по data-action, а не
   перевешиваются заново при каждом рендере — это дешевле и не плодит
   утечки слушателей на больших таблицах.
   ========================================================================= */
function gotoClient(id){ appState.selectedClientId = Number(id); appState.screen='profile'; appState.profileTab='overview'; persistState(); render(); }

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'nav': appState.screen = el.dataset.screen; persistState(); render(); break;
    case 'modal-close': closeModal(); break;
    case 'reset-filters':
      appState.country='all'; appState.industry='all'; appState.tier='all'; appState.npsSegment='all'; appState.search='';
      appState.clientsPage=0; appState.commentsPage=0;
      persistState(); syncTopbarControls(); renderScreen(); showToast('Фильтры сброшены'); break;
    case 'drill': {
      const rows = getFilteredRows(); const k = el.dataset.drill;
      if(k==='nps') drillToRows('Строки, вошедшие в расчёт NPS', rows.filter(r=>isNum(r.nps)));
      if(k==='promoter') drillToRows('Промоутеры', rows.filter(r=>npsSegmentOf(r.nps)==='promoter'));
      if(k==='passive') drillToRows('Нейтралы', rows.filter(r=>npsSegmentOf(r.nps)==='passive'));
      if(k==='detractor') drillToRows('Детракторы', rows.filter(r=>npsSegmentOf(r.nps)==='detractor'));
      break;
    }
    case 'goto-client': gotoClient(el.dataset.client); break;
    case 'clients-mode': appState.clientsMode = el.dataset.mode; appState.clientsPage=0; renderScreen(); break;
    case 'clients-preset': appState.clientsPreset = el.dataset.preset; appState.clientsPage=0; renderScreen(); break;
    case 'clients-sort': {
      const k = el.dataset.sort;
      appState.clientsSort = { key:k, dir: appState.clientsSort.key===k && appState.clientsSort.dir==='desc' ? 'asc':'desc' };
      renderScreen(); break;
    }
    case 'clients-page': {
      appState.clientsPage += (el.dataset.dir==='next'?1:-1); renderScreen(); break;
    }
    case 'comments-page': {
      appState.commentsPage += (el.dataset.dir==='next'?1:-1); renderScreen(); break;
    }
    case 'export-clients': {
      let rows = getFilteredRows();
      if(appState.clientsMode==='unique') rows = uniqueClientRows(rows);
      rows = sortRows(applyClientsPreset(rows), appState.clientsSort.key, appState.clientsSort.dir, true);
      exportCSV('spectra_clients.csv', rows, [
        {label:'ID', value:r=>r.id},{label:'Год', value:r=>r.year},{label:'Страна', value:r=>r.country},
        {label:'Тир', value:r=>r.tier},{label:'Отрасль', value:r=>r.industry},{label:'Удовлетворённость', value:r=>r.sat},
        {label:'NPS', value:r=>r.nps},{label:'Сегмент', value:r=>segRu(npsSegmentOf(r.nps))}]);
      break;
    }
    case 'export-comments': {
      let feed = buildCommentsFeed(getFilteredRows());
      if(appState.commentsSearch) feed = feed.filter(c=>c.text.toLowerCase().includes(appState.commentsSearch.toLowerCase()));
      if(appState.commentsTheme!=='all') feed = feed.filter(c=>c.theme===appState.commentsTheme);
      exportCSV('spectra_comments.csv', feed, [
        {label:'ID', value:c=>c.id},{label:'Год', value:c=>c.year_},{label:'Страна', value:c=>c.country},
        {label:'Показатель', value:c=>c.metric},{label:'Оценка', value:c=>c.score},{label:'NPS', value:c=>c.nps},
        {label:'Тема (авто)', value:c=>c.theme},{label:'Текст', value:c=>c.text}]);
      break;
    }
    case 'comparison-mode': appState.comparisonMode = el.dataset.mode; renderScreen(); break;
    case 'profile-tab': appState.profileTab = el.dataset.tab; {
      const clientRows = RAW_DATA.filter(r=>r.id===appState.selectedClientId).sort((a,b)=>a.year-b.year);
      document.querySelectorAll('.tabs button[data-action="profile-tab"]').forEach(b=>b.classList.toggle('active', b.dataset.tab===appState.profileTab));
      renderProfileTab(clientRows, clientRows[clientRows.length-1]);
      break;
    }
  }
}
function handleChange(e){
  const el = e.target;
  const action = el.dataset ? el.dataset.action : null;
  if(!action) return;
  switch(action){
    case 'filter-period': appState.period = el.value; persistState(); renderScreen(); break;
    case 'filter-country': appState.country = el.value; appState.clientsPage=0; persistState(); renderScreen(); break;
    case 'filter-industry': appState.industry = el.value; appState.clientsPage=0; persistState(); renderScreen(); break;
    case 'filter-tier': appState.tier = el.value; appState.clientsPage=0; persistState(); renderScreen(); break;
    case 'filter-nps': appState.npsSegment = el.value; appState.clientsPage=0; persistState(); renderScreen(); break;
    case 'ov-hist-pick': appState.driverPickHist = el.value; safeDraw('chOvHist', node=>{ const dist=distribution(getFilteredRows(), appState.driverPickHist, 1, 5); barChart(node, {labels:Object.keys(dist), values:Object.values(dist), yMin:0, yMax:Math.max(1,...Object.values(dist)), colors:Object.keys(dist).map(()=>'#1D6E85')}); }); break;
    case 'comments-theme': appState.commentsTheme = el.value; appState.commentsPage=0; renderScreen(); break;
    case 'comments-sort': appState.commentsSort = {key:el.value, dir:'desc'}; renderScreen(); break;
    case 'profile-pick': gotoClient(el.value); break;
  }
}
const handleGlobalSearchInput = debounce(function(el){ appState.search = el.value; appState.clientsPage=0; appState.commentsPage=0; renderScreen(); }, 250);
const handleCommentsSearchInput = debounce(function(el){ appState.commentsSearch = el.value; appState.commentsPage=0; renderScreen(); }, 250);
function handleInput(e){
  const el = e.target;
  const action = el.dataset ? el.dataset.action : null;
  if(action==='global-search') handleGlobalSearchInput(el);
  if(action==='comments-search') handleCommentsSearchInput(el);
}
function handleKeydown(e){
  const el = e.target;
  if(el && el.dataset && el.dataset.action==='profile-search-key' && e.key==='Enter'){
    const v = Number(el.value);
    if(RAW_DATA.some(r=>r.id===v)) gotoClient(v); else showToast('ID не найден в выгрузке', true);
  }
}

/* Глобальная защита: ошибка в любом месте приложения не должна "убивать" интерфейс. */
window.addEventListener('error', function(e){
  console.error('[spectra] uncaught error', e.error||e.message);
  showToast('Произошла внутренняя ошибка интерфейса. Навигация продолжает работать.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('[spectra] unhandled promise rejection', e.reason);
});

/* =========================================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================================= */
function initApp(){
  loadPersistedState();
  buildShellOnce();
  document.body.addEventListener('click', handleClick);
  document.body.addEventListener('change', handleChange);
  document.body.addEventListener('input', handleInput);
  document.body.addEventListener('keydown', handleKeydown);
  document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });
  render();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initApp); else initApp();
</script>
